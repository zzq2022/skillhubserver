[project]
name = "skillhubserver-backend"
version = "0.1.0"
description = "SkillHub Server backend — self-hosted skill management platform (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    # Database drivers
    "aiosqlite>=0.20",       # async SQLite (sqlite+aiosqlite)
    "asyncpg>=0.30",         # async PostgreSQL (postgresql+asyncpg)
    "psycopg[binary]>=3.2",  # sync PostgreSQL
    "pyyaml>=6.0.3",
    "pyjwt>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv]
# App package structure is populated in a later task (T0.3); manage deps only for now.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
