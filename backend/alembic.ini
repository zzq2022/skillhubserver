# Alembic configuration for skillhubserver.
# DATABASE_URL is taken from environment / Settings (see alembic/env.py),
# so sqlalchemy.url below is only a fallback for local defaults.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Fallback only - env.py overrides this from Settings / DATABASE_URL.
sqlalchemy.url = sqlite:///./data/db/skillhubserver.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
